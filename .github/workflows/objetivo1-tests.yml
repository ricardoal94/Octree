name: Objetivos 1, 2 y soporte de 3 - pruebas sin dataset

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-objetivo2.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-objetivo2.txt
      - name: Ejecutar pruebas sin dataset ni GPU
        run: python -m pytest -m "not dataset and not gpu"
